// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "26.1.10909125"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      project.android {
        defaultConfig {
          externalNativeBuild {
            cmake {
              cppFlags "-std=c++20", "-fexceptions", "-frtti"
              arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_PARALLEL_LEVEL=2"
            }
          }
        }
      }
    }
  }
}

// Automatically patch react-android header before CMake compiles C++ modules
allprojects {
  tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach { task ->
    task.doFirst {
      def gradleUserHome = gradle.gradleUserHomeDir
      fileTree(gradleUserHome).matching {
        include "**/react/renderer/core/graphicsConversions.h"
      }.each { file ->
        if (file.text.contains("std::format")) {
          file.text = file.text.replace("std::format(\"{}%\", dimension.value)", "std::to_string(dimension.value) + \"%\"")
          println("[Patch] Replaced std::format in: " + file.path)
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
