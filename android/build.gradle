// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "28.2.13676358"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      project.android {
        defaultConfig {
          externalNativeBuild {
            cmake {
              cppFlags "-std=c++20", "-fexceptions", "-frtti"
              arguments "-DANDROID_STL=c++_shared", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
          }
        }
      }
    }
  }
}
// Automatically patch react-android header before CMake compiles C++ modules
allprojects {
  tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach { task ->
    task.doFirst {
      def gradleUserHome = gradle.gradleUserHomeDir
      try {
        fileTree(gradleUserHome).matching {
          include "**/transformed/**/graphicsConversions.h"
        }.each { file ->
          try {
            if (file.exists() && file.isFile()) {
              def text = file.text
              if (text.contains("std::format")) {
                file.text = text.replace("std::format(\"{}%\", dimension.value)", "std::to_string(dimension.value) + \"%\"")
                println("[Patch] Replaced std::format in: " + file.path)
              }
            }
          } catch (Exception ignored) {}
        }
      } catch (Exception ignored) {}
      try {
        fileTree(gradleUserHome).matching {
          include "**/transformed/**/propsConversions.h"
        }.each { file ->
          try {
            if (file.exists() && file.isFile()) {
              def text = file.text
              if (text.contains("LOG(ERROR)")) {
                file.text = text.replaceAll(/(?s)LOG\(ERROR\)[\s\S]*?;/, "(void)key; (void)e;")
                println("[Patch] Replaced LOG(ERROR) in: " + file.path)
              }
            }
          } catch (Exception ignored) {}
        }
      } catch (Exception ignored) {}
    }
  }
}
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"